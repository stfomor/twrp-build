name: Build TWRP
on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "TWRP minimal manifest branch"
        default: "twrp-12.1"
      make_target:
        description: "recoveryimage or vendorbootimage"
        default: "recoveryimage"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python-is-python3 bc cpio ccache
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Sync TWRP source
        run: |
          mkdir ~/twrp && cd ~/twrp
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ inputs.manifest_branch }}
          ~/bin/repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Clone device tree
        run: |
          cd ~/twrp
          git clone --depth=1 https://github.com/BeruCrypt02/twrp_device_infinix_X6886-a15.git device/infinix/X6886
          ls device/infinix/X6886

      - name: Build
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          MK=$(ls device/infinix/X6886/twrp_*.mk | head -1)
          NAME=$(basename "$MK" .mk)
          echo "Lunch target: $NAME"
          source build/envsetup.sh
          lunch ${NAME}-eng
          mka ${{ inputs.make_target }} -j$(nproc)

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-image
          path: |
            ~/twrp/out/target/product/*/recovery.img
            ~/twrp/out/target/product/*/vendor_boot.img
